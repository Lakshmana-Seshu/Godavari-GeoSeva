<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="waterBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="steelShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Sky / Background -->
  <rect width="800" height="500" fill="url(#waterBg)"/>

  <!-- Tiled Flooring -->
  <rect y="380" width="800" height="120" fill="#0f172a" opacity="0.12"/>
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.3">
    <line x1="0" y1="410" x2="800" y2="410"/>
    <line x1="0" y1="440" x2="800" y2="440"/>
    <line x1="0" y1="470" x2="800" y2="470"/>
    <line x1="100" y1="380" x2="60" y2="500"/>
    <line x1="250" y1="380" x2="210" y2="500"/>
    <line x1="400" y1="380" x2="360" y2="500"/>
    <line x1="550" y1="380" x2="510" y2="500"/>
    <line x1="700" y1="380" x2="660" y2="500"/>
  </g>

  <!-- RO Water Kiosk Canopy / Pavilion -->
  <polygon points="120,130 680,130 730,190 70,190" fill="#0369a1"/>
  <rect x="70" y="190" width="660" height="20" fill="#f59e0b"/>

  <!-- Supporting Pillars -->
  <rect x="140" y="210" width="24" height="190" fill="url(#steelShine)" rx="4"/>
  <rect x="636" y="210" width="24" height="190" fill="url(#steelShine)" rx="4"/>

  <!-- Main Stainless Steel Drinking Water Dispenser Counter -->
  <rect x="180" y="260" width="440" height="130" fill="url(#steelShine)" rx="10" stroke="#475569" stroke-width="3"/>
  <rect x="200" y="280" width="400" height="80" fill="#1e293b" rx="6"/>

  <!-- RO Purification Unit Badges -->
  <rect x="220" y="295" width="110" height="50" rx="6" fill="#0284c7"/>
  <text x="235" y="325" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">RO + UV</text>

  <rect x="470" y="295" width="110" height="50" rx="6" fill="#10b981"/>
  <text x="480" y="325" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">TESTED SAFE</text>

  <!-- 4 Dispensing Taps with Water Flow -->
  <g fill="#e2e8f0" stroke="#334155" stroke-width="2">
    <!-- Tap 1 -->
    <rect x="250" y="240" width="12" height="25" rx="3"/>
    <polygon points="246,240 266,240 256,232"/>
    <!-- Tap 2 -->
    <rect x="350" y="240" width="12" height="25" rx="3"/>
    <polygon points="346,240 366,240 356,232"/>
    <!-- Tap 3 -->
    <rect x="440" y="240" width="12" height="25" rx="3"/>
    <polygon points="436,240 456,240 446,232"/>
    <!-- Tap 4 -->
    <rect x="540" y="240" width="12" height="25" rx="3"/>
    <polygon points="536,240 556,240 546,232"/>
  </g>

  <!-- Flowing Water Streams &amp; Bubbles -->
  <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round">
    <line x1="256" y1="265" x2="256" y2="380"/>
    <line x1="356" y1="265" x2="356" y2="380"/>
    <line x1="446" y1="265" x2="446" y2="380"/>
    <line x1="546" y1="265" x2="546" y2="380"/>
  </g>

  <!-- Clean Water Splashes -->
  <circle cx="256" cy="380" r="16" fill="#38bdf8" opacity="0.6"/>
  <circle cx="356" cy="380" r="16" fill="#38bdf8" opacity="0.6"/>
  <circle cx="446" cy="380" r="16" fill="#38bdf8" opacity="0.6"/>
  <circle cx="546" cy="380" r="16" fill="#38bdf8" opacity="0.6"/>

  <!-- Giant Droplet Icon Center -->
  <path d="M 400 130 C 375 165, 360 190, 360 215 C 360 240, 378 255, 400 255 C 422 255, 440 240, 440 215 C 440 190, 425 165, 400 130 Z" fill="#38bdf8" opacity="0.9" stroke="#ffffff" stroke-width="3"/>

  <!-- Facility Title Watermark -->
  <rect x="24" y="24" width="280" height="38" rx="8" fill="#0369a1" opacity="0.9"/>
  <text x="36" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">RO PURIFIED DRINKING WATER</text>
</svg>
