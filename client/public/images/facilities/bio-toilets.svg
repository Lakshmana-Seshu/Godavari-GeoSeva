<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="toiletBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="boothGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Sky &amp; Atmosphere -->
  <rect width="800" height="500" fill="url(#toiletBg)"/>

  <!-- Ground Pavement -->
  <rect y="400" width="800" height="100" fill="#1e1b4b" opacity="0.3"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#818cf8" stroke-width="4"/>

  <!-- Modern Modular Sanitation Complex Main Roof -->
  <polygon points="80,140 720,140 760,190 40,190" fill="#312e81"/>
  <rect x="40" y="190" width="720" height="16" fill="#10b981"/>

  <!-- Eco Green Bio-Digester Solar Canopy -->
  <rect x="180" y="100" width="440" height="35" rx="5" fill="#047857"/>
  <text x="240" y="123" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">ECO-FRIENDLY BIO-DIGESTER COMPLEX</text>

  <!-- 3 Toilet Cabins / Units -->
  <!-- Unit 1: Female -->
  <g>
    <rect x="120" y="206" width="160" height="194" fill="url(#boothGrad)" rx="8" stroke="#475569" stroke-width="3"/>
    <rect x="135" y="225" width="130" height="165" fill="#f43f5e" opacity="0.15" rx="6" stroke="#fb7185" stroke-width="2"/>
    <!-- Door Handle -->
    <rect x="245" y="310" width="8" height="24" rx="2" fill="#334155"/>
    <!-- Female Icon Badge -->
    <circle cx="200" cy="265" r="24" fill="#f43f5e"/>
    <path d="M 200 252 A 6 6 0 1 0 200 264 A 6 6 0 1 0 200 252 M 194 276 L 206 276 L 202 265 L 198 265 Z M 200 276 L 200 284 M 195 280 L 205 280" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
    <text x="175" y="315" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#9f1239">WOMEN</text>
  </g>

  <!-- Unit 2: Accessible / Divyangjan -->
  <g>
    <rect x="320" y="206" width="160" height="194" fill="url(#boothGrad)" rx="8" stroke="#475569" stroke-width="3"/>
    <rect x="335" y="225" width="130" height="165" fill="#0284c7" opacity="0.15" rx="6" stroke="#38bdf8" stroke-width="2"/>
    <!-- Door Handle -->
    <rect x="445" y="310" width="8" height="24" rx="2" fill="#334155"/>
    <!-- Accessible Wheelchair Badge -->
    <circle cx="400" cy="265" r="24" fill="#0284c7"/>
    <circle cx="400" cy="254" r="4" fill="#ffffff"/>
    <path d="M 395 264 L 404 264 L 400 274 L 408 274 M 392 272 A 6 6 0 1 0 398 278" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="360" y="315" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0369a1">ACCESSIBLE</text>
  </g>

  <!-- Unit 3: Male -->
  <g>
    <rect x="520" y="206" width="160" height="194" fill="url(#boothGrad)" rx="8" stroke="#475569" stroke-width="3"/>
    <rect x="535" y="225" width="130" height="165" fill="#4f46e5" opacity="0.15" rx="6" stroke="#818cf8" stroke-width="2"/>
    <!-- Door Handle -->
    <rect x="645" y="310" width="8" height="24" rx="2" fill="#334155"/>
    <!-- Male Icon Badge -->
    <circle cx="600" cy="265" r="24" fill="#4f46e5"/>
    <circle cx="600" cy="254" r="5" fill="#ffffff"/>
    <path d="M 593 263 L 607 263 L 604 278 L 596 278 Z" fill="#ffffff"/>
    <text x="585" y="315" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#3730a3">MEN</text>
  </g>

  <!-- Water Wash Basin Outside -->
  <rect x="40" y="340" width="60" height="60" fill="#94a3b8" rx="6"/>
  <rect x="48" y="350" width="44" height="20" fill="#38bdf8" rx="4"/>
  <line x1="70" y1="330" x2="70" y2="350" stroke="#334155" stroke-width="3"/>

  <!-- Facility Title Watermark -->
  <rect x="24" y="24" width="280" height="38" rx="8" fill="#312e81" opacity="0.9"/>
  <text x="36" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">MODULAR BIO-TOILET COMPLEX</text>
</svg>
