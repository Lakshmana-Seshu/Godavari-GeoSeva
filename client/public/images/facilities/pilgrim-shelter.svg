<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shelterBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="roofPattern" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Warm Sky Atmosphere -->
  <rect width="800" height="500" fill="url(#shelterBg)"/>

  <!-- Paved Mandapam Platform -->
  <rect y="380" width="800" height="120" fill="#451a03" opacity="0.25"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#fef3c7" stroke-width="4"/>

  <!-- Grand Temple Mandapam / Shelter Canopy -->
  <polygon points="60,110 740,110 780,180 20,180" fill="url(#roofPattern)"/>
  <rect x="20" y="180" width="760" height="18" fill="#f59e0b"/>

  <!-- Kalasams on Shelter Roof -->
  <polygon points="395,110 400,80 405,110" fill="#fef08a"/>
  <circle cx="400" cy="78" r="6" fill="#f59e0b"/>

  <!-- Colonnade of Carved Stone / Steel Pillars -->
  <g fill="#fef3c7" stroke="#92400e" stroke-width="3">
    <!-- Pillar 1 -->
    <rect x="90" y="198" width="30" height="182" rx="4"/>
    <rect x="80" y="198" width="50" height="14" rx="2" fill="#d97706"/>
    <rect x="80" y="366" width="50" height="14" rx="2" fill="#d97706"/>
    <!-- Pillar 2 -->
    <rect x="250" y="198" width="30" height="182" rx="4"/>
    <rect x="240" y="198" width="50" height="14" rx="2" fill="#d97706"/>
    <rect x="240" y="366" width="50" height="14" rx="2" fill="#d97706"/>
    <!-- Pillar 3 -->
    <rect x="520" y="198" width="30" height="182" rx="4"/>
    <rect x="510" y="198" width="50" height="14" rx="2" fill="#d97706"/>
    <rect x="510" y="366" width="50" height="14" rx="2" fill="#d97706"/>
    <!-- Pillar 4 -->
    <rect x="680" y="198" width="30" height="182" rx="4"/>
    <rect x="670" y="198" width="50" height="14" rx="2" fill="#d97706"/>
    <rect x="670" y="366" width="50" height="14" rx="2" fill="#d97706"/>
  </g>

  <!-- Ceiling Fans for Summer Cooling -->
  <g stroke="#78350f" stroke-width="3">
    <line x1="200" y1="198" x2="200" y2="230"/>
    <ellipse cx="200" cy="235" rx="35" ry="6" fill="#fef3c7"/>
    <line x1="400" y1="198" x2="400" y2="230"/>
    <ellipse cx="400" cy="235" rx="35" ry="6" fill="#fef3c7"/>
    <line x1="600" y1="198" x2="600" y2="230"/>
    <ellipse cx="600" cy="235" rx="35" ry="6" fill="#fef3c7"/>
  </g>

  <!-- Pilgrim Rest Mats / Carpets -->
  <g fill="#10b981" opacity="0.85" rx="4">
    <rect x="140" y="350" width="90" height="26" rx="4"/>
    <rect x="300" y="350" width="180" height="26" rx="4" fill="#0284c7"/>
    <rect x="570" y="350" width="90" height="26" rx="4"/>
  </g>

  <!-- Luggage &amp; Cloakroom Safe Keeping Sign -->
  <rect x="320" y="240" width="160" height="40" rx="8" fill="#1e293b"/>
  <text x="338" y="265" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">PILGRIM REST SHED</text>

  <!-- Queue Management Steel Railings -->
  <g stroke="#94a3b8" stroke-width="4" fill="none">
    <line x1="0" y1="410" x2="800" y2="410"/>
    <line x1="0" y1="440" x2="800" y2="440"/>
    <line x1="100" y1="380" x2="100" y2="450"/>
    <line x1="300" y1="380" x2="300" y2="450"/>
    <line x1="500" y1="380" x2="500" y2="450"/>
    <line x1="700" y1="380" x2="700" y2="450"/>
  </g>

  <!-- Facility Title Watermark -->
  <rect x="24" y="24" width="280" height="38" rx="8" fill="#78350f" opacity="0.9"/>
  <text x="36" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">PILGRIM TRANSIT SHELTER</text>
</svg>
