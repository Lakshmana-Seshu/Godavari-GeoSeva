<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="roadSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="asphaltRoad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="240" fill="url(#roadSky)"/>

  <!-- Historic Godavari Arch / Havelock Bridge in background -->
  <g stroke="#0f172a" stroke-width="4" fill="none" opacity="0.6">
    <line x1="0" y1="200" x2="800" y2="200" stroke-width="8"/>
    <path d="M 0 200 Q 75 120 150 200 Q 225 120 300 200 Q 375 120 450 200 Q 525 120 600 200 Q 675 120 750 200 L 800 200"/>
    <line x1="75" y1="200" x2="75" y2="240" stroke-width="6"/>
    <line x1="225" y1="200" x2="225" y2="240" stroke-width="6"/>
    <line x1="375" y1="200" x2="375" y2="240" stroke-width="6"/>
    <line x1="525" y1="200" x2="525" y2="240" stroke-width="6"/>
    <line x1="675" y1="200" x2="675" y2="240" stroke-width="6"/>
  </g>

  <!-- Paved Access Road / Highway Corridor -->
  <polygon points="280,240 520,240 800,500 0,500" fill="url(#asphaltRoad)"/>

  <!-- Road Center Dashed Line -->
  <g stroke="#facc15" stroke-width="6" stroke-dasharray="25,18">
    <line x1="400" y1="240" x2="400" y2="500"/>
  </g>

  <!-- Pedestrian Safety Holding Area &amp; Steel Barricades -->
  <g stroke="#e2e8f0" stroke-width="4" fill="none">
    <!-- Left Barricade -->
    <line x1="160" y1="260" x2="20" y2="500" stroke="#f59e0b" stroke-width="6"/>
    <line x1="180" y1="260" x2="40" y2="500" stroke="#ffffff" stroke-width="5"/>
    <!-- Right Barricade -->
    <line x1="640" y1="260" x2="780" y2="500" stroke="#f59e0b" stroke-width="6"/>
    <line x1="620" y1="260" x2="760" y2="500" stroke="#ffffff" stroke-width="5"/>
  </g>

  <!-- Toll &amp; Pedestrian Access Gate Checkpost -->
  <g>
    <rect x="250" y="160" width="300" height="40" fill="#0284c7" rx="6" stroke="#ffffff" stroke-width="2"/>
    <text x="270" y="186" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">PEDESTRIAN CORRIDOR ACCESS GATE</text>
    <line x1="280" y1="200" x2="280" y2="300" stroke="#334155" stroke-width="8"/>
    <line x1="520" y1="200" x2="520" y2="300" stroke="#334155" stroke-width="8"/>
    <!-- Green LED Open Signal -->
    <circle cx="500" cy="180" r="10" fill="#10b981"/>
    <circle cx="500" cy="180" r="18" fill="#6ee7b7" opacity="0.4"/>
  </g>

  <!-- Directional Signpost -->
  <g>
    <line x1="100" y1="280" x2="100" y2="420" stroke="#334155" stroke-width="6"/>
    <rect x="30" y="280" width="140" height="50" fill="#10b981" rx="4" stroke="#ffffff" stroke-width="2"/>
    <text x="42" y="302" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">TO PUSHKAR GHAT</text>
    <text x="42" y="318" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fef08a">350m DIRECT ACCESS</text>
  </g>

  <!-- Facility Title Watermark -->
  <rect x="24" y="24" width="290" height="38" rx="8" fill="#1e293b" opacity="0.9"/>
  <text x="36" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">BRIDGE &amp; ACCESS ROAD GATEWAY</text>
</svg>
