<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Sky & River Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="35%" stop-color="#1e3a5f"/>
      <stop offset="65%" stop-color="#c25e2e"/>
      <stop offset="85%" stop-color="#e89443"/>
      <stop offset="100%" stop-color="#fcd385"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#fff5db" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#f8a442" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#dc4e28" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a192f" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c45d31"/>
      <stop offset="25%" stop-color="#733224"/>
      <stop offset="60%" stop-color="#1b3644"/>
      <stop offset="100%" stop-color="#071b26"/>
    </linearGradient>

    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16222f"/>
      <stop offset="100%" stop-color="#070c12"/>
    </linearGradient>

    <filter id="blurSun" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="680" fill="url(#skyGrad)"/>

  <!-- Sun Glow -->
  <circle cx="960" cy="520" r="260" fill="url(#sunGlow)" filter="url(#blurSun)"/>
  <circle cx="960" cy="520" r="70" fill="#fffbe8"/>

  <!-- Distant Kovvur Riverbank Silhouette -->
  <path d="M0 580 Q 320 560 640 575 T 1280 570 T 1920 575 L 1920 620 L 0 620 Z" fill="#132433" opacity="0.8"/>

  <!-- Temple Spire Silhouettes on Distant Bank -->
  <polygon points="520,575 528,510 536,575" fill="#0d1822"/>
  <polygon points="540,575 545,525 550,575" fill="#0d1822"/>
  <polygon points="1420,570 1430,495 1440,570" fill="#0d1822"/>
  <polygon points="1445,570 1452,515 1460,570" fill="#0d1822"/>

  <!-- Godavari Arch Bridge Silhouette -->
  <g fill="url(#bridgeGrad)">
    <!-- Bridge Piers -->
    <rect x="0" y="550" width="1920" height="12"/>
    <rect x="220" y="555" width="28" height="85"/>
    <rect x="520" y="555" width="28" height="85"/>
    <rect x="820" y="555" width="28" height="85"/>
    <rect x="1120" y="555" width="28" height="85"/>
    <rect x="1420" y="555" width="28" height="85"/>
    <rect x="1720" y="555" width="28" height="85"/>

    <!-- Distinctive Bowstring Arches -->
    <path d="M 234 550 Q 370 460 534 550" stroke="#0a121a" stroke-width="12" fill="none"/>
    <path d="M 534 550 Q 670 460 834 550" stroke="#0a121a" stroke-width="12" fill="none"/>
    <path d="M 834 550 Q 970 460 1134 550" stroke="#0a121a" stroke-width="12" fill="none"/>
    <path d="M 1134 550 Q 1270 460 1434 550" stroke="#0a121a" stroke-width="12" fill="none"/>
    <path d="M 1434 550 Q 1570 460 1734 550" stroke="#0a121a" stroke-width="12" fill="none"/>

    <!-- Vertical Suspension Ribs -->
    <line x1="370" y1="465" x2="370" y2="550" stroke="#0a121a" stroke-width="4"/>
    <line x1="670" y1="465" x2="670" y2="550" stroke="#0a121a" stroke-width="4"/>
    <line x1="970" y1="465" x2="970" y2="550" stroke="#0a121a" stroke-width="4"/>
    <line x1="1270" y1="465" x2="1270" y2="550" stroke="#0a121a" stroke-width="4"/>
    <line x1="1570" y1="465" x2="1570" y2="550" stroke="#0a121a" stroke-width="4"/>
  </g>

  <!-- Godavari River Water -->
  <rect x="0" y="562" width="1920" height="518" fill="url(#waterGrad)"/>

  <!-- Sun Reflection on Water -->
  <ellipse cx="960" cy="620" rx="140" ry="25" fill="#fdbf5a" opacity="0.6" filter="url(#blurSun)"/>
  <ellipse cx="960" cy="720" rx="90" ry="18" fill="#e87635" opacity="0.45" filter="url(#blurSun)"/>
  <ellipse cx="960" cy="850" rx="60" ry="14" fill="#c25026" opacity="0.3" filter="url(#blurSun)"/>

  <!-- Water Wave Ribbons -->
  <path d="M0 640 C 320 620, 640 655, 960 635 C 1280 615, 1600 650, 1920 630" stroke="#ffbd66" stroke-width="2" fill="none" opacity="0.35"/>
  <path d="M0 720 C 350 700, 700 735, 1050 710 C 1400 690, 1750 730, 1920 715" stroke="#f68c42" stroke-width="2.5" fill="none" opacity="0.25"/>
  <path d="M0 830 C 400 810, 800 845, 1200 820 C 1600 800, 1800 840, 1920 825" stroke="#e0582d" stroke-width="3" fill="none" opacity="0.18"/>

  <!-- Pilgrim Boat Silhouettes -->
  <g fill="#0b1319">
    <path d="M 380 680 Q 420 705 470 685 Q 430 675 380 680 Z"/>
    <line x1="425" y1="680" x2="425" y2="640" stroke="#0b1319" stroke-width="2.5"/>
    <polygon points="425,645 455,655 425,665"/>

    <path d="M 1480 730 Q 1525 758 1580 736 Q 1535 725 1480 730 Z"/>
    <line x1="1530" y1="730" x2="1530" y2="685" stroke="#0b1319" stroke-width="2.5"/>
    <polygon points="1530,690 1565,702 1530,715"/>
  </g>
</svg>

