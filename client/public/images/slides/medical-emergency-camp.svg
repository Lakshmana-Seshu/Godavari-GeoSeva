<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="medSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="45%" stop-color="#881337"/>
      <stop offset="85%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <radialGradient id="redCrossGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffe4e6" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#f43f5e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4c0519" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="tarpTent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Sky Gradient -->
  <rect width="1920" height="700" fill="url(#medSky)"/>

  <!-- Red Cross Aura Glow -->
  <circle cx="960" cy="400" r="320" fill="url(#redCrossGlow)"/>

  <!-- Giant Medical Cross Symbol in Center Background -->
  <g fill="#ffffff" opacity="0.3">
    <rect x="910" y="240" width="100" height="320" rx="20"/>
    <rect x="800" y="350" width="320" height="100" rx="20"/>
  </g>

  <!-- Pulse Line (ECG Waveform across screen) -->
  <path d="M 0 520 L 600 520 L 650 520 L 680 430 L 720 620 L 760 480 L 800 550 L 830 520 L 1090 520 L 1120 430 L 1160 620 L 1200 480 L 1240 550 L 1270 520 L 1920 520" stroke="#fda4af" stroke-width="4" fill="none" opacity="0.6"/>

  <!-- Ground -->
  <rect x="0" y="680" width="1920" height="400" fill="#0f172a"/>
  <line x1="0" y1="680" x2="1920" y2="680" stroke="#f43f5e" stroke-width="4" opacity="0.6"/>

  <!-- Medical Base Camp Tent (Center-Left) -->
  <g>
    <polygon points="320,680 540,480 760,680" fill="url(#tarpTent)" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="540,480 760,680 840,680 620,480" fill="#94a3b8" opacity="0.4"/>
    <!-- Medical Cross on Tent -->
    <rect x="525" y="550" width="30" height="80" rx="6" fill="#e11d48"/>
    <rect x="500" y="575" width="80" height="30" rx="6" fill="#e11d48"/>
    <text x="540" y="660" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">24x7 MEDICAL POST</text>
  </g>

  <!-- Ambulance Silhouette (Right) -->
  <g fill="#f8fafc">
    <rect x="1220" y="540" width="320" height="140" rx="16"/>
    <polygon points="1540,680 1540,580 1480,540 1480,680" fill="#f8fafc"/>
    <!-- Wheels -->
    <circle cx="1290" cy="680" r="32" fill="#0f172a" stroke="#cbd5e1" stroke-width="8"/>
    <circle cx="1470" cy="680" r="32" fill="#0f172a" stroke="#cbd5e1" stroke-width="8"/>
    <!-- Red Cross on Ambulance -->
    <rect x="1340" y="580" width="16" height="50" rx="4" fill="#e11d48"/>
    <rect x="1323" y="597" width="50" height="16" rx="4" fill="#e11d48"/>
    <!-- Emergency Flasher -->
    <rect x="1370" y="525" width="36" height="15" rx="6" fill="#38bdf8"/>
    <rect x="1410" y="525" width="36" height="15" rx="6" fill="#e11d48"/>
    <text x="1380" y="650" font-family="sans-serif" font-size="20" font-weight="900" fill="#e11d48">108</text>
  </g>
</svg>

